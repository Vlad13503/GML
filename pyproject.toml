[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interaction-order"
version = "0.1.0"
description = "Interpreting cardinality in hyperedge prediction under interaction-order shift"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "truststore>=0.9; sys_platform == 'win32'"]

[project.scripts]
interaction-order = "hnn_project.cli:main"

[tool.setuptools.packages.find]
include = ["hnn_project*"]
